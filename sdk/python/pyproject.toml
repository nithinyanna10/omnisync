[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisync"
version = "0.1.0"
description = "OmniSync Protocol SDK for Python - Interoperability layer for AI agent frameworks"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "OmniSync Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
keywords = ["ai", "agents", "multi-agent", "protocol", "interoperability", "langchain", "autogen", "crewai"]
project-urls = {
    Homepage = "https://github.com/nithinyanna10/omnisync",
    Documentation = "https://github.com/nithinyanna10/omnisync",
    Repository = "https://github.com/nithinyanna10/omnisync",
    Issues = "https://github.com/nithinyanna10/omnisync/issues",
}
dependencies = [
    "pydantic>=2.0.0",
    "aiohttp>=3.8.0",
    "websockets>=11.0",
    "jsonschema>=4.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]
langchain = ["langchain>=0.1.0"]
autogen = ["pyautogen>=0.2.0"]
crewai = ["crewai>=0.1.0"]
llamaindex = ["llama-index>=0.9.0"]

